services:
  postgres:
    image: postgres:16-alpine
    container_name: permuteapp-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: permute
      POSTGRES_PASSWORD: permute
      POSTGRES_DB: permuteapp
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build: ./backend
    container_name: permuteapp-api
    restart: unless-stopped
    depends_on:
      - postgres
    environment:
      DATABASE_URL: postgresql://permute:permute@postgres:5432/permuteapp?schema=public
      JWT_ACCESS_SECRET: change-me-in-prod
      JWT_REFRESH_SECRET: change-me-too
      PORT: "3000"
    ports:
      - "3000:3000"

volumes:
  postgres_data:
