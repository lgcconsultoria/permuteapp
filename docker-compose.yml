services:
  postgres:
    image: postgres:16-alpine
    container_name: permuteapp-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: permute
      POSTGRES_PASSWORD: permute
      POSTGRES_DB: permuteapp
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U permute -d permuteapp"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: permuteapp-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://permute:permute@postgres:5432/permuteapp?schema=public
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-dev-access-secret-change-me}
      JWT_ACCESS_EXPIRES_IN: 15m
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-dev-refresh-secret-change-me}
      JWT_REFRESH_EXPIRES_IN: 7d
      BCRYPT_ROUNDS: "10"
      PORT: "3000"
    ports:
      - "3000:3000"

volumes:
  postgres_data:
